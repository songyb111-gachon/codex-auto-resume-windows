[package]
name = "car-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[lib]
name = "car_bin"
path = "src/lib.rs"

[[bin]]
name = "codex-auto-resume"
path = "src/main.rs"

[[bin]]
name = "codex-auto-resume-setup"
path = "src/bin/setup.rs"

# D18: the MCP launcher at app\mcp\codex-auto-resume-mcp.exe, starting this installation's core.
[[bin]]
name = "codex-auto-resume-mcp"
path = "src/bin/mcp.rs"

# S6.2b: the stub core, for the release proofs alone (src/bin/proof.rs); codex-auto-resume.exe is the real core now.
[[bin]]
name = "car-core-proof"
path = "src/bin/proof.rs"

[dependencies]
car-control = { path = "../car-control" }
car-platform = { path = "../car-platform" }
car-watcher = { path = "../car-watcher" }
car-config = { path = "../car-config" }
car-machine = { path = "../car-machine" }
car-policy = { path = "../car-policy" }
car-store = { path = "../car-store" }
# Integration 8: `activate` reads the notices' URIs with car-surface's notice_uris and codex_link (src/uris.rs).
car-surface = { path = "../car-surface" }
car-words = { path = "../car-words" }
