[package]
name = "car-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Dev-only differential harness: runs the Rust core's calls for tests/rustdiff"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# `car-harness serve`: JSON lines on stdin, one reply line each on stdout (PLAN 4.2).
[[bin]]
name = "car-harness"
path = "src/main.rs"

# The stand-in for codex-auto-resume.exe that the CODEX_AR_CORE=rust shim starts: the same argv as the
# Python entry points, after `bridge` / `mcp`. Only `bridge --home H defaults` is ported (S0.4's proof).
[[bin]]
name = "car-core-stub"
path = "src/bin/car-core-stub.rs"

# S3.3: the stand-in codex.exe the app-server and transport diffs copy into a scratch bin folder (it starts nothing).
[[bin]]
name = "car-fake-codex"
path = "src/bin/car-fake-codex.rs"

# S5.2: car-bin's dispatcher over a world, for the legacy shapes' end-to-end diff (copied into a scratch installation).
[[bin]]
name = "car-core-world"
path = "src/bin/car-core-world.rs"

[dependencies]
# D5: JSON is written by car-machine's Python-compatible writer.
car-machine = { path = "../car-machine" }
# S1.1: the leaf crates' calls (src/leaves/).
car-config = { path = "../car-config" }
car-words = { path = "../car-words" }
car-brand = { path = "../car-brand" }
# The differential harness's Rust side (PLAN.md 1.2 row 17, section 4): dev only, never shipped.
# The state store (S1.2): every store call, and the bundled SQLite (D4) through it.
car-store = { path = "../car-store" }
# S2.1: car-policy's classifier and policy (src/classify.rs), and the gates' types the store's calls take; S2.2: its settings
# and plug (src/policy.rs, `policy.batch`).
car-policy = { path = "../car-policy" }
# S3.2: car-codex's readers (src/codex.rs: `codex.script` and the `codex.*` cases of `leaves.batch`).
car-codex = { path = "../car-codex" }
# S3.1: the one link probe (`links::is_symlink`), which the harness wires into car-store's and car-config's `Links`.
car-platform = { path = "../car-platform" }
# S4.1: car-engine's engine and car-scheduler's watch (src/engine.rs: `engine.open`, `engine.step`).
car-engine = { path = "../car-engine" }
car-scheduler = { path = "../car-scheduler" }
# S5.1a: car-control's bridge (src/bridge.rs: `bridge.run`).
car-control = { path = "../car-control" }
# S6.0: car-surface's models, words and decisions (src/surface.rs: `surface.batch`), and car-brand's numbers they read.
car-surface = { path = "../car-surface" }
# S5.2: car-core-stub runs codex-auto-resume.exe's roles and command line (car-bin) for the CODEX_AR_CORE=rust shim.
car-bin = { path = "../car-bin" }
# S6.1: car-watcher's loop over a scripted world and its pieces (src/watcher.rs: `watcher.loop`, `watcher.batch`).
car-watcher = { path = "../car-watcher" }
# D5: serde to read (the harness's requests).
serde_json = "1"
