[package]
name = "car-codex"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
car-config = { path = "../car-config" }
car-machine = { path = "../car-machine" }
car-platform = { path = "../car-platform" }
car-policy = { path = "../car-policy" }
# D4: Codex's own databases are read through the same bundled SQLite the store uses (one version on every PC).
rusqlite = { version = "0.43", features = ["bundled"] }
# A dict that keeps its insertion order (the reader's caches evict the oldest, as the Python's dicts do).
indexmap = "2"

# Review 7: its own harness, as the test binary is also the stand-in engine it starts.
[[test]]
name = "review7_send_receipt"
path = "tests/review7_send_receipt.rs"
harness = false

# Fix 7: the same for `--version` and `queue --help` (S2's other reads).
[[test]]
name = "fix7_engine_checks"
path = "tests/fix7_engine_checks.rs"
harness = false
