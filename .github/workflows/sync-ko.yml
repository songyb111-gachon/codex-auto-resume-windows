name: sync ko

# Rebuild the Korean branch from main, every time main's tests pass.
#
# `ko` was an independent fork for four releases. It carried its own engine, installer,
# GUI, workflows and tests, and it fell three releases behind while still telling Korean
# readers the tool made no network request. That is what a second copy of a codebase does
# when a person has to remember to merge it, so the person has been taken out of the loop:
# ko is now generated, and generated from a commit whose tests are green.
#
# Why `workflow_run` rather than `push`: a push-triggered sync would publish main's code
# to a second branch before anything had tested it, which is worse than being behind.
# The tests workflow is the gate, and this reads the SHA it actually tested rather than
# whatever main's head happens to be by the time this starts - those differ whenever a
# second push lands during a test run, and the difference is the whole guarantee.
#
# Why it cannot loop: `workflow_run` fires on the *tests* workflow, and the tests workflow
# runs on pushes to main. This pushes to ko, never to main, so nothing it does can start
# it again.

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to build ko from. Defaults to main's head."
        required: false

permissions:
  contents: write

# One sync at a time, and never cancel one that is running: a cancelled force-push can
# leave ko pointing at a tree that no run ever finished writing. Out-of-order completion
# is handled by each run building from its own tested SHA rather than from a shared head.
concurrency:
  group: sync-ko
  cancel-in-progress: false

jobs:
  sync:
    # Only a green tests run, only from this repository, and only from main. A fork's
    # pull request cannot satisfy `head_repository.full_name == github.repository`, and
    # a red main cannot satisfy the conclusion.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Windows, because that is where this product's tests run. The step below runs the
    # suite against the tree about to be published, and a suite that ran somewhere the
    # product does not support would prove nothing about the branch it is guarding.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      # The tested commit, not main's current head. On a workflow_run event the default
      # checkout ref is the *default branch's* head, which is a different commit whenever
      # something was pushed while the tests were running.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.sha || 'main' }}
          fetch-depth: 0
          # The steps below run this commit's own scripts and tests. The token must not be
          # sitting in .git/config while they do; only the final push step is given it.
          persist-credentials: false

      - name: Say which commit this is building from
        shell: bash
        run: |
          echo "source commit: $(git rev-parse HEAD)"
          echo "subject      : $(git log -1 --pretty=%s)"

      # The dispatch input is described as a commit on main, and until now nothing
      # checked it: pasting a fork pull request's SHA ran that code's ko_sync.py and test
      # suite with a write token and force-pushed its tree to ko. Whatever the trigger,
      # the commit being published must already be part of main.
      - name: Refuse anything that is not on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$(git rev-parse HEAD) is not on main; ko is only ever built from main"
            exit 1
          fi

      - name: Replace the English documents with their Korean counterparts
        shell: bash
        run: python scripts/ko_sync.py --root .

      # Staged before anything looks at the tree, not as part of committing it.
      #
      # The marker is what tells the test suite this is a generated branch, and the suite
      # requires it to be *tracked* - a bare file on disk is what a stray local run of
      # ko_sync leaves behind, and that must never disarm the Korean invariants on main.
      # Staging it in the publish step meant it was still untracked while the tests ran,
      # so they refused to skip and the run failed. It did exactly what it is for: it
      # would not publish a tree whose tests do not pass.
      - name: Stage the generated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Force, because main gitignores it: the marker is legitimate only here.
          git add -f .github/GENERATED-BRANCH.md

      # GITHUB_TOKEN may not push a change under .github/workflows. Nothing here should
      # be producing one - the mapping only names documents - so this turns a server-side
      # rejection nobody can read into a named failure, and stops a future maintainer
      # adding a workflow path to the mapping without finding out why they should not.
      - name: Refuse to sync a change to the workflows themselves
        shell: bash
        run: |
          if ! git diff --cached --quiet -- .github/workflows; then
            echo "ko_sync.py changed .github/workflows, which GITHUB_TOKEN cannot push."
            git --no-pager diff --cached --stat -- .github/workflows
            exit 1
          fi

      # The claim in CONTRIBUTING.md is that ko carries main's tests unchanged. That was
      # true of the files and false of the outcome: the sync deletes the Korean sources
      # those tests read, so twelve of them errored on the branch, and a pull request
      # opened against ko was answered with failures about the wrong thing. Nothing
      # noticed, because test.yml only runs on main and on pull requests. Now the tree
      # is tested before it is published, on the platform the product supports.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test the tree that is about to be published
        shell: bash
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

      - name: Publish the branch
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.sha }}
          # The only step that holds the token, and it runs no code from the tree.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_sha="${SOURCE_SHA:-$(git rev-parse HEAD)}"
          # Against ko, not against HEAD. HEAD here is main's tested commit, so comparing
          # with it asked "did the sync change anything relative to main" - which it
          # always did, by construction, since it had just rewritten six documents. The
          # guard could never fire and the message claimed a comparison it had not made.
          if git fetch --no-tags origin ko 2>/dev/null &&              git diff --cached --quiet FETCH_HEAD; then
            echo "the generated tree is already what ko contains; nothing to push"
            exit 0
          fi
          git commit -m "Generate ko from main@${source_sha}" \
                     -m "Built by .github/workflows/sync-ko.yml from a tested commit." \
                     -m "Do not edit this branch: see .github/GENERATED-BRANCH.md."
          # Force, because ko is generated rather than developed. Its history is a log of
          # syncs, and a sync that could not fast-forward would otherwise stall the branch
          # for ever - which is exactly how it came to be three releases behind.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/ko
