name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede an in-flight run for the same ref: the newer commit is the one worth knowing
# about, and the ko sync keys off whichever run reports success, so leaving a stale run
# to finish would publish a branch nobody is waiting on.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # This tool targets Windows only, so CI runs on Windows only.
    runs-on: windows-latest
    # `scripts/python_support.json` is where these are decided, and
    # `tests/test_python_support.py` fails if this list and that file stop agreeing.
    # A matrix cannot read a file, so the list is repeated here and the test is what
    # keeps the repetition honest.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          # The next Python, while it is still a release candidate. It is not decoration:
          # it compiles the sources and runs the same suite, and a failure is annotated
          # exactly like any other, so a real incompatibility is visible the day it
          # appears. It does not block, because a defect in a pre-release interpreter is
          # not a defect in this product - and finding out about a real one in October,
          # from a user, is worse than finding out now from a lane nobody had to merge.
          - python-version: "3.15"
            experimental: true
    # Only the pre-release lane is allowed to fail the job without failing the run.
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests run their own code here. The read-only token is still not
          # left on disk for it.
          persist-credentials: false
          # The upgrade and downgrade tests build their databases with the store code
          # of real tagged releases, so the tags and their commits must be here.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # Needed for the future lane, and harmless for the others: a stable release
          # is still preferred where one exists, so this does not quietly move a
          # blocking version onto a release candidate. It also means the day the next
          # Python ships, that lane starts testing the real thing without an edit.
          allow-prereleases: true

      - name: Say which interpreter this actually is
        # The lane is named for a line, not a build. When a failure turns out to be the
        # interpreter's, the first question is which one - and on the pre-release lane
        # that answer changes under you.
        run: python -c "import sys; print(sys.version)"

      - name: Compile all sources
        run: python -m compileall -q src tests scripts

      - name: Run the automated test suite
        # These tests use fakes and temp dirs. They never contact the ChatGPT app
        # and never send a message to any Codex conversation.
        # CODEX_AR_LIVE is deliberately unset, so the live checks stay skipped.
        #
        # A failure is repeated as a workflow error annotation, not just written to the
        # log. Reading a run's log needs repository admin rights; annotations are part
        # of the run's public status, so "which test failed" is answerable by anyone
        # looking at the failure - including from a machine that cannot reproduce it.
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          $output = python -m unittest discover -s tests -v 2>&1 | Out-String
          $failed = $LASTEXITCODE -ne 0
          Write-Host $output
          if ($failed) {
            # Only the failures, not the roll-call of passing tests. An annotation is
            # capped at 4096 characters, and a verbose run fills that with "ok" lines
            # long before it reaches the part that says what went wrong.
            $lines = $output -split "`r?`n"
            $first = ($lines | Select-String -Pattern '^(FAIL|ERROR):' | Select-Object -First 1)
            $detail = if ($first) {
              ($lines | Select-Object -Skip ($first.LineNumber - 1) | Where-Object { $_.Trim() })
            } else {
              # No failure header at all means the process died rather than failed a
              # test; the tail is then the only evidence there is.
              ($lines | Where-Object { $_.Trim() } | Select-Object -Last 25)
            }
            $text = ($detail -join '%0A') -replace '::', ':'
            if ($text.Length -gt 3800) { $text = $text.Substring(0, 3800) }
            Write-Host "::error title=test suite failed::$text"
            exit 1
          }

      - name: CLI smoke test in an isolated home
        env:
          PYTHONPATH: src
        run: |
          python src\auto_resume.py --home "${{ runner.temp }}\ar-home" --quiet install
          python src\auto_resume.py --home "${{ runner.temp }}\ar-home" --quiet status
          python src\auto_resume.py --home "${{ runner.temp }}\ar-home" --quiet install
          python src\auto_resume.py --home "${{ runner.temp }}\ar-home" --quiet uninstall
          python src\auto_resume.py --home "${{ runner.temp }}\ar-home" --quiet uninstall
