name: release

# Publishing runs here rather than on anyone's machine, so the artifact people download
# is built from the tagged commit by a job whose whole input is public. Nothing is
# uploaded from a developer's working tree, and no personal credential is involved: the
# job authenticates with the repository's own short-lived GITHUB_TOKEN.

# A published version is immutable. `v0.5.4` names one archive with one SHA-256, for as
# long as the release exists - because the plugin's bootstrap pins that digest and refuses
# anything else, and because a version whose bytes can change is not much of a version.
#
# This used to have a dispatch path that rebuilt an existing tag and re-uploaded over its
# assets with `--clobber`. It existed for a good reason - a tag's source had been corrected
# and the published archive had not followed - and it quietly broke the guarantee the
# digest pin depends on. A correction now needs a new version, which is the honest way to
# say "these are different bytes".
#
# What is left of the dispatch is a dry run: it builds and verifies whatever ref you point
# it at and keeps the archive as a workflow artifact. It cannot publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build and verify. Never publishes."
        required: false

permissions:
  contents: write
  # For build provenance on the published archive. `attestations: write` records it and
  # `id-token: write` is how the runner proves to the attestation service who it is.
  id-token: write
  attestations: write

jobs:
  release:
    # The product is Windows-only, and the release contains two Windows executables
    # compiled with the in-box C# compiler, so it can only be built on Windows.
    runs-on: windows-latest

    steps:
      # A dispatch builds and verifies whatever ref it names and publishes nothing, so
      # naming an existing tag re-checks that tag's source rather than replacing what it
      # released. Only a tag push reaches the three steps that touch a release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content .codex-plugin/plugin.json -Raw | ConvertFrom-Json
          $declared = $manifest.version
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tagged = $env:GITHUB_REF -replace '^refs/tags/v', ''
            # A tag that disagrees with the manifest would publish an archive whose name,
            # plugin version and release title do not match. Stop instead.
            if ($tagged -ne $declared) {
              throw "tag v$tagged does not match plugin.json version $declared"
            }
          }
          "version=$declared" >> $env:GITHUB_OUTPUT
          Write-Host "building v$declared"

      - name: Run the automated test suite
        # A tag is not a reason to skip the tests; it is the last moment they still help.
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

      - name: Build the settings window and the MCP launcher
        shell: pwsh
        run: ./build/make_gui.ps1

      - name: Build the release archive
        run: python build/make_release.py

      - name: Extract the release notes
        run: python build/release_notes.py "${{ steps.version.outputs.version }}" --output "${{ runner.temp }}/notes.md"

      - name: Check the archive is what it claims to be
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = "build/dist/CodexAutoResume-v$version-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "the build did not produce $zip" }
          # The checksum published beside the archive has to be the checksum OF the
          # archive; a stale one is worse than none, because people verify against it.
          $recorded = (Get-Content "$zip.sha256" -Raw).Split(' ')[0].Trim()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($recorded -ne $actual) { throw "checksum mismatch: recorded $recorded, actual $actual" }
          # An archive with no interpreter would install and then do nothing at all.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
          foreach ($required in @('payload/runtime/python.exe',
                                  'payload/app/src/codex_auto_resume/mcpserver.py',
                                  'payload/app/mcp/codex-auto-resume-mcp.exe',
                                  'payload/app/.mcp.json',
                                  'payload/CodexAutoResumeSettings.exe',
                                  'install/install.ps1',
                                  'Install.cmd')) {
            if ($names -notcontains $required) { throw "the archive is missing $required" }
          }
          Write-Host "archive verified: $actual"

      - name: Keep the archive even when nothing is published
        uses: actions/upload-artifact@v4
        with:
          name: CodexAutoResume-v${{ steps.version.outputs.version }}-win-x64
          path: |
            build/dist/*.zip
            build/dist/*.sha256

      # The immutability gate. Publishing is refused outright if this version already
      # has assets, rather than replacing them - so the archive a `v0.5.4` download
      # returns today is the archive it returned the day it was published.
      - name: Refuse to republish a version that already has assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $existing = gh release view "v$version" --json assets 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $existing) {
            Write-Host "no release for v$version yet; publishing is allowed"
            exit 0
          }
          $assets = ($existing | ConvertFrom-Json).assets
          if ($assets -and @($assets).Count -gt 0) {
            Write-Host "::error::Release v$version already has published assets:"
            foreach ($a in @($assets)) { Write-Host ("::error::  " + $a.name) }
            throw "A published version is immutable. Bump the version and tag again instead of replacing v$version."
          }
          Write-Host "release v$version exists but carries no assets; publishing is allowed"

      # Build provenance, so a downloaded archive can be traced back to the workflow run
      # and the commit that produced it. Runs before publication: an archive that cannot
      # be attested should not become a release.
      - name: Attest the archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/dist/CodexAutoResume-v${{ steps.version.outputs.version }}-win-x64.zip

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          gh release create "v$version" `
            "build/dist/CodexAutoResume-v$version-win-x64.zip" `
            "build/dist/CodexAutoResume-v$version-win-x64.zip.sha256" `
            --title "v$version" `
            --notes-file "${{ runner.temp }}/notes.md"

      - name: Say what a dry run did and did not do
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Write-Host "Built and verified v${{ steps.version.outputs.version }}."
          Write-Host "Nothing was published: a dispatch cannot create or change a release."
          Write-Host "The archive is attached to this run as a workflow artifact." 
